<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Claude Code permission modes</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#475569">Press Shift+Tab to cycle. The status bar always shows the mode you are in.</text>

  <rect x="40" y="96" width="880" height="10" rx="5" fill="url(#g)"/>
  <text x="40" y="126" font-size="13" fill="#166534" font-weight="600">More oversight</text>
  <text x="920" y="126" text-anchor="end" font-size="13" fill="#991b1b" font-weight="600">More autonomy</text>

  <g font-size="13">
    <rect x="40" y="144" width="160" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Manual</text>
    <text x="120" y="196" text-anchor="middle" font-family="Consolas, monospace" fill="#475569">default</text>
    <text x="56" y="232" fill="#1e293b">Reads freely.</text>
    <text x="56" y="252" fill="#1e293b">Asks before every</text>
    <text x="56" y="272" fill="#1e293b">edit or command.</text>
    <text x="56" y="330" font-weight="600" fill="#166534">Sensitive or</text>
    <text x="56" y="350" font-weight="600" fill="#166534">unfamiliar code</text>

    <rect x="216" y="144" width="160" height="250" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="296" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">Plan</text>
    <text x="296" y="196" text-anchor="middle" font-family="Consolas, monospace" fill="#475569">plan</text>
    <text x="232" y="232" fill="#1e293b">Explores and writes</text>
    <text x="232" y="252" fill="#1e293b">a plan. No edits</text>
    <text x="232" y="272" fill="#1e293b">until you approve.</text>
    <text x="232" y="330" font-weight="600" fill="#3730a3">Design before</text>
    <text x="232" y="350" font-weight="600" fill="#3730a3">you build</text>

    <rect x="392" y="144" width="160" height="250" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <text x="472" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#115e59">Accept edits</text>
    <text x="472" y="196" text-anchor="middle" font-family="Consolas, monospace" fill="#475569">acceptEdits</text>
    <text x="408" y="232" fill="#1e293b">Edits files and runs</text>
    <text x="408" y="252" fill="#1e293b">mkdir, mv, cp without</text>
    <text x="408" y="272" fill="#1e293b">asking. Other cmds ask.</text>
    <text x="408" y="330" font-weight="600" fill="#115e59">Fast iteration you</text>
    <text x="408" y="350" font-weight="600" fill="#115e59">review as you go</text>

    <rect x="568" y="144" width="160" height="250" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="648" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">Auto</text>
    <text x="648" y="196" text-anchor="middle" font-family="Consolas, monospace" fill="#475569">auto</text>
    <text x="584" y="232" fill="#1e293b">Does almost anything.</text>
    <text x="584" y="252" fill="#1e293b">A safety classifier</text>
    <text x="584" y="272" fill="#1e293b">blocks risky actions.</text>
    <text x="584" y="330" font-weight="600" fill="#92400e">Long tasks, fewer</text>
    <text x="584" y="350" font-weight="600" fill="#92400e">prompts</text>

    <rect x="744" y="144" width="176" height="250" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="832" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Bypass</text>
    <text x="832" y="196" text-anchor="middle" font-family="Consolas, monospace" fill="#475569">bypassPermissions</text>
    <text x="760" y="232" fill="#1e293b">No checks at all</text>
    <text x="760" y="252" fill="#1e293b">(deny rules still</text>
    <text x="760" y="272" fill="#1e293b">apply).</text>
    <text x="760" y="330" font-weight="600" fill="#991b1b">Throwaway VMs and</text>
    <text x="760" y="350" font-weight="600" fill="#991b1b">containers only</text>
  </g>
  <text x="480" y="424" text-anchor="middle" font-size="13" fill="#475569">There is also dontAsk for CI: only pre-approved tools run, everything else is refused.</text>
</svg>
