<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Anatomy of a skill</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#475569">Only the description is always in view. The rest loads when the skill is used.</text>

  <rect x="40" y="96" width="420" height="310" rx="12" fill="#0f172a"/>
  <g font-family="Consolas, monospace" font-size="14">
    <text x="60" y="126" fill="#94a3b8">weekly-report/</text>
    <text x="80" y="150" fill="#e2e8f0">SKILL.md</text>
    <text x="80" y="174" fill="#94a3b8">template.md</text>
    <text x="80" y="198" fill="#94a3b8">scripts/totals.py</text>
    <line x1="60" y1="214" x2="440" y2="214" stroke="#334155"/>
    <text x="60" y="240" fill="#f472b6">---</text>
    <text x="60" y="262" fill="#fbbf24">name:</text><text x="116" y="262" fill="#e2e8f0">weekly-report</text>
    <text x="60" y="284" fill="#fbbf24">description:</text><text x="180" y="284" fill="#e2e8f0">Use when the user</text>
    <text x="60" y="306" fill="#e2e8f0">  asks for a weekly status report...</text>
    <text x="60" y="328" fill="#f472b6">---</text>
    <text x="60" y="354" fill="#e2e8f0"># Steps</text>
    <text x="60" y="376" fill="#e2e8f0">1. Read template.md ...</text>
  </g>

  <g font-size="14">
    <rect x="540" y="104" width="380" height="84" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="560" y="134" font-size="16" font-weight="700" fill="#92400e">Always loaded: name + description</text>
    <text x="560" y="158" fill="#334155">Claude reads this to decide "is this the</text>
    <text x="560" y="178" fill="#334155">job?" Write it as WHEN to use, not WHAT.</text>

    <rect x="540" y="208" width="380" height="84" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="560" y="238" font-size="16" font-weight="700" fill="#3730a3">On use: the body of SKILL.md</text>
    <text x="560" y="262" fill="#334155">Your step-by-step procedure, rules</text>
    <text x="560" y="282" fill="#334155">and what NOT to do.</text>

    <rect x="540" y="312" width="380" height="84" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <text x="560" y="342" font-size="16" font-weight="700" fill="#115e59">When needed: extra files</text>
    <text x="560" y="366" fill="#334155">Templates, examples, scripts. Read or</text>
    <text x="560" y="386" fill="#334155">run only if the steps call for them.</text>
  </g>
  <line x1="462" y1="276" x2="536" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="462" y1="360" x2="536" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="462" y1="176" x2="536" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
</svg>
