<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Why confident mistakes happen</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#475569">A language model writes the most likely next words. Likely is usually true, but not always.</text>

  <rect x="40" y="130" width="220" height="110" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">Your question</text>
  <text x="150" y="202" text-anchor="middle" font-size="13" fill="#475569">+ anything you attached</text>

  <rect x="330" y="130" width="250" height="110" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="455" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Predicts a plausible</text>
  <text x="455" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">answer</text>
  <text x="455" y="224" text-anchor="middle" font-size="13" fill="#475569">from patterns it learned</text>

  <rect x="650" y="100" width="270" height="80" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="785" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Plausible and true</text>
  <text x="785" y="158" text-anchor="middle" font-size="13" fill="#475569">the usual case</text>

  <rect x="650" y="196" width="270" height="80" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="785" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Plausible and invented</text>
  <text x="785" y="254" text-anchor="middle" font-size="13" fill="#475569">a figure, citation or URL that fits</text>

  <line x1="262" y1="185" x2="326" y2="185" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="582" y1="175" x2="646" y2="142" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="582" y1="195" x2="646" y2="236" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="40" y="300" width="880" height="72" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">The fix is mostly in your prompt</text>
  <text x="480" y="354" text-anchor="middle" font-size="14" fill="#334155">Give it the source, allow "I don't know", ask for exact quotes, and check anything you could not spot yourself.</text>
</svg>
